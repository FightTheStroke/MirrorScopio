# Da qui nasce MirrorScopio.xcodeproj.
#
# Perché un file di testo e non il progetto Xcode vero: un `.xcodeproj` è una
# cartella piena di riferimenti generati, che si sporca da sola a ogni apertura
# e che nei conflitti di merge non si riesce a leggere. Questo file invece si
# legge, si confronta e si corregge.
#
# Il progetto generato sta comunque nel repository, ma non è la sorgente: è un
# risultato. Ci sta perché Xcode Cloud controlla che il `.xcodeproj` esista al
# momento del clone, prima di eseguire qualsiasi script — quindi generarlo al
# volo là non è possibile. Per evitare che i due si scollino in silenzio,
# `scripts/genera-progetto.sh` produce sempre lo stesso file byte per byte e un
# controllo su GitHub rifiuta ogni modifica in cui i due non corrispondono.
# Regola pratica: si cambia questo file, poi si rigenera. Mai il contrario.
#
# Prima di questo file l'app veniva costruita da ~120 righe di bash che
# scrivevano l'Info.plist a mano, chiamavano `swiftc` e firmavano a mano.
# Funzionava, ma tutto quello che Xcode fa da solo — eseguire le prove,
# misurare, guardare l'albero di accessibilità — non c'era, e ogni guasto
# nasceva nel bash invece che nel codice dell'app.

name: MirrorScopio

options:
  bundleIdPrefix: org.fightthestroke
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# La versione non si scrive qui. Prima c'erano due segnaposto fissi ("0.0.0" e
# "0") con scritto accanto che li avrebbe sovrascritti build.sh: non è mai
# successo, perché build.sh compila per conto suo e il progetto Xcode non lo
# apre nemmeno. Risultato: chi costruiva da Xcode otteneva un'applicazione che
# si dichiarava 0.0.0. Ora i due numeri arrivano da Versione.xcconfig, che
# `scripts/genera-progetto.sh` riscrive dal file VERSION prima di generare il
# progetto. Attenzione: se un numero torna qui sotto in `settings`, vince su
# quello del file e il difetto ricomincia.
configFiles:
  Debug: Versione.xcconfig
  Release: Versione.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # Di serie si firma alla buona: così una copia appena scaricata compila su
    # qualsiasi Mac, anche senza il certificato della fondazione. Il pacchetto
    # vero lo firma `scripts/package.sh` con l'identità della fondazione.
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

    # Concorrenza rigorosa: fa ricomparire gli avvisi che dicono dove il codice
    # tocca lo stesso stato da due thread diversi.
    #
    # Non e' un'aggiunta, e' un ripristino. Quando le prove passavano da un
    # Package.swift questi avvisi si vedevano; quando quel file e' stato tolto
    # sono spariti dallo schermo — ma i difetti erano rimasti tutti al loro
    # posto, semplicemente non li vedeva piu' nessuno. Un problema che non si
    # vede e' peggio di un problema che si vede.
    #
    # In linguaggio Swift 5 restano avvisi e non errori: il programma compila
    # lo stesso. Diventeranno errori il giorno in cui si passera' a Swift 6, ed
    # e' esattamente per arrivarci senza sorprese che stanno qui adesso.
    # Attenzione: build.sh mostra solo gli avvisi che parlano di funzioni
    # deprecate, quindi per leggerli tutti serve chiamare xcodebuild a mano.
    SWIFT_STRICT_CONCURRENCY: complete

    # Solo Apple Silicon. Non e' una scelta di comodo: l'app usa
    # FoundationModels, il modello di linguaggio che sta dentro macOS, e su un
    # Mac Intel quel framework non esiste. Costruire anche per Intel vorrebbe
    # dire produrre meta' pacchetto che non partirebbe comunque.
    ARCHS: arm64

    # Toglie dal programma finito il codice che nessuno chiama. Lo consiglia
    # Xcode dalla finestra «Update to recommended settings».
    #
    # Sta scritto qui e non nelle impostazioni di Xcode perche' il progetto
    # Xcode e' generato da questo file: una spunta messa a mano nella finestra
    # sparirebbe alla prima ricostruzione.
    #
    # Quanto vale, misurato accendendolo e spegnendolo: 2336 KB contro 2384,
    # cioe' 48 KB. Poco. Per un po' qui c'e' stato scritto che risparmiava
    # megabyte, e non era vero: allora `build.sh` compilava per conto suo con
    # `swiftc` e questo file non lo apriva nemmeno, quindi l'impostazione non
    # arrivava all'app che la gente scarica. Adesso ci arriva, e vale 48 KB.
    DEAD_CODE_STRIPPING: YES

# File che non si compilano ma che fanno parte del progetto: documentazione,
# script, configurazioni. Senza questo elenco Xcode mostra solo il codice, e
# per cambiare una riga del CHANGELOG bisogna uscire dall'editor.
#
# Qui vanno solo file che stanno davvero nel repository. Un file di lavoro
# locale (in .gitignore) c'era finito, e su GitHub xcodegen si e' fermato:
# «Invalid file group». Sul mio Mac il file c'era, quindi non se ne accorgeva
# nessuno — il modo classico di rompere la macchina di tutti gli altri.
fileGroups:
  - README.md
  - AGENTS.md
  - CHANGELOG.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - SECURITY.md
  - roadmap.md
  - LICENSE
  - NOTICE
  - VERSION
  - project.yml
  - build.sh
  - test.sh
  - MirrorScopio.plist
  - MirrorScopio.entitlements
  - docs
  - scripts
  - .github

targets:

  MirrorScopio:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AppIcon.icns
        buildPhase: resources
      # Il manifesto della privacy che chiede Apple. Deve stare nella radice
      # delle risorse del pacchetto, altrimenti Apple non lo trova.
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Cartella intera, non file sciolti: dentro il pacchetto deve restare una
      # cartella «Fonts», perché è lì che ATSApplicationFontsPath va a cercare.
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.fightthestroke.mirrorscopio
        PRODUCT_NAME: MirrorScopio
        INFOPLIST_FILE: MirrorScopio.plist
        CODE_SIGN_ENTITLEMENTS: MirrorScopio.entitlements
        # Serve alle prove: le classi dell'app devono essere visibili al fascio
        # di prove senza doverle marcare `public` una per una.
        ENABLE_TESTABILITY: YES
        COMBINE_HIDPI_IMAGES: YES
        # Le stesse restrizioni del pacchetto firmato valgono anche qui: se una
        # restrizione rompe qualcosa deve rompersi sul mio Mac, non su quello di
        # una famiglia. Sta sull'applicazione e basta: messo in fondo a tutto
        # finiva anche sul lanciatore delle prove, e un lanciatore blindato si
        # rifiuta di caricare un pacchetto firmato da qualcun altro — errore
        # «different Team IDs», che manda a cercare il problema nei certificati
        # invece che qui.
        ENABLE_HARDENED_RUNTIME: YES

  # Le prove che non hanno bisogno di aprire l'applicazione: la scala adattiva,
  # il contrasto dei colori in tutti i temi, il confronto fra versioni.
  Verifiche:
    type: bundle.unit-test
    platform: macOS
    sources: [Verifiche]
    dependencies:
      - target: MirrorScopio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.fightthestroke.mirrorscopio.verifiche
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MirrorScopio.app/Contents/MacOS/MirrorScopio"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Le prove che aprono l'applicazione vera e la usano come la userebbe una
  # persona: solo tastiera, e leggendo l'albero di accessibilità — cioè
  # esattamente quello che VoiceOver pronuncia ad alta voce.
  ProveDaTastiera:
    type: bundle.ui-testing
    platform: macOS
    sources: [ProveDaTastiera]
    dependencies:
      - target: MirrorScopio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.fightthestroke.mirrorscopio.tastiera
        TEST_TARGET_NAME: MirrorScopio

schemes:
  MirrorScopio:
    build:
      targets:
        MirrorScopio: all
        Verifiche: [test]
        ProveDaTastiera: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - Verifiche
        - ProveDaTastiera
