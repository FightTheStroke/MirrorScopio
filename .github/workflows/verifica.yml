name: Verifica

# A ogni push si controlla che l'app compili ancora. Non serve nessun
# certificato: qui si firma alla buona, tanto il pacchetto vero lo fa il
# workflow di rilascio.
# Serve solo leggere il codice: nessun permesso di scrittura.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compila:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: La promessa — niente rete in Sources/
        run: |
          set -euo pipefail
          # AGENTS.md, regola 2: "una URLSession in questo codice è un bug".
          # Finché era solo una frase, bastava una distrazione a tradirla.
          # Adesso è un cancello: se rientra la rete, la build si ferma.
          TROVATO="$(grep -rnE 'URLSession|URLRequest|NWConnection|CFReadStream|import Network' Sources/ || true)"
          if [ -n "$TROVATO" ]; then
            echo "$TROVATO"
            echo "::error::I dati del bambino non escono da quel Mac. Qui c'è del codice di rete."
            exit 1
          fi
          echo "Nessuna rete in Sources/ — la promessa regge."

      - name: Compilo
        run: ./build.sh

      - name: Controllo che l'app sia davvero un'app
        run: |
          set -euo pipefail
          test -x build/MirrorScopio.app/Contents/MacOS/MirrorScopio
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" \
            build/MirrorScopio.app/Contents/Info.plist
          codesign --verify --verbose=1 build/MirrorScopio.app

      - name: Controllo che la versione e il changelog siano allineati
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' \
            build/MirrorScopio.app/Contents/Info.plist)"
          if [ "$VERSION" != "$PLIST_VERSION" ]; then
            echo "::error::VERSION dice $VERSION ma l'app dice $PLIST_VERSION"
            exit 1
          fi
          grep -q "## \[$VERSION\]\|## \[Non ancora rilasciato\]" CHANGELOG.md
