name: Rilascio

# Quando si pubblica un tag `v*`, GitHub compila, firma, fa timbrare l'app da
# Apple e allega il pacchetto alla release. Chi lo scarica fa doppio clic:
# niente Xcode, niente terminale, niente avvisi di sicurezza.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag già esistente da ri-pacchettizzare (es. v0.2.0)'
        required: true

jobs:
  pacchetto:
    runs-on: macos-26
    # Il certificato di firma della fondazione e la password di Apple vivono
    # qui dentro. Chiunque possa far partire questo workflow può farci firmare
    # qualunque cosa: basterebbe un tag creato ad arte, perché il codice che
    # gira è quello *del tag*, non quello del ramo principale.
    #
    # L'ambiente è il lucchetto: i segreti stanno lì, e GitHub non li consegna
    # finché una persona non approva a mano. È scomodo apposta — un rilascio
    # all'anno vale più di una firma rubata.
    environment: rilascio
    # Il permesso di scrittura vive nel job, non nel workflow: così non viene
    # ereditato da eventuali job futuri che non ne hanno bisogno.
    permissions:
      contents: write
    timeout-minutes: 45

    steps:
      - name: Prendo il codice
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Il numero di build è il conteggio dei commit: serve la storia intera.
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Metto il certificato in un portachiavi usa-e-getta
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12" ]; then
            echo "::error::Manca il segreto MACOS_CERT_P12. Lancia ./scripts/setup-github-secrets.sh"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/firma.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Compilo, firmo, faccio timbrare da Apple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/package.sh --notarize

      - name: Verifico che si aprirebbe davvero su un Mac qualsiasi
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          hdiutil attach -nobrowse -quiet "build/MirrorScopio-$VERSION.dmg"
          spctl -a -vvv -t install "/Volumes/MirrorScopio $VERSION/MirrorScopio.app" 2>&1 | tee /tmp/spctl.txt
          hdiutil detach "/Volumes/MirrorScopio $VERSION" -quiet
          grep -q "source=Notarized Developer ID" /tmp/spctl.txt

      - name: Verifico che l'app dentro lo zip si aggiorni davvero
        run: |
          set -euo pipefail
          # Lo zip è il pacchetto che le versioni già installate scaricano da
          # sole. Qui si controlla esattamente quello che controllerà l'app sul
          # Mac di una famiglia: la firma è la nostra, e il timbro di Apple è
          # attaccato addosso — se manca, l'aggiornamento si fermerebbe lì.
          VERSION="$(cat VERSION)"
          PROVA="$(mktemp -d)"
          ditto -x -k "build/MirrorScopio-$VERSION.zip" "$PROVA"
          codesign --verify --strict --deep "$PROVA/MirrorScopio.app"
          codesign --verify -R '=anchor apple generic and certificate leaf[subject.OU] = "93T3LG4NPG" and identifier "org.fightthestroke.mirrorscopio"' "$PROVA/MirrorScopio.app"
          spctl --assess --type execute -vv "$PROVA/MirrorScopio.app" 2>&1 | tee /tmp/spctl-zip.txt
          grep -q "source=Notarized Developer ID" /tmp/spctl-zip.txt
          xcrun stapler validate "$PROVA/MirrorScopio.app"
          rm -rf "$PROVA"

      - name: Allego il pacchetto alla release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          # Il tag passa da una variabile d'ambiente, non interpolato nello
          # script: un tag scritto ad arte diventerebbe altrimenti un comando
          # eseguito con il portachiavi di firma aperto.
          TAG="$TAG_INPUT"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "MirrorScopio $VERSION" --generate-notes
          gh release upload "$TAG" "build/MirrorScopio-$VERSION.dmg" \
            "build/MirrorScopio-$VERSION.zip" --clobber

      - name: Tengo da parte il pacchetto anche qui
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MirrorScopio-dmg
          path: |
            build/*.dmg
            build/*.zip
          retention-days: 30
