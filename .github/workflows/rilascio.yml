name: Rilascio

# Quando si pubblica un tag `v*`, GitHub compila, firma, fa timbrare l'app da
# Apple e allega il pacchetto alla release. Chi lo scarica fa doppio clic:
# niente Xcode, niente terminale, niente avvisi di sicurezza.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag già esistente da ri-pacchettizzare (es. v0.2.0)'
        required: true

jobs:
  pacchetto:
    runs-on: macos-26
    # Il certificato di firma della fondazione e la password di Apple vivono
    # qui dentro. Chiunque possa far partire questo workflow può farci firmare
    # qualunque cosa: basterebbe un tag creato ad arte, perché il codice che
    # gira è quello *del tag*, non quello del ramo principale.
    #
    # L'ambiente è il lucchetto: i segreti stanno lì dentro e non altrove.
    #
    # Fino al 29 agosto 2026 il lucchetto era anche un'approvazione a mano.
    # Non c'è più, ed è una scelta: guardava il nome dell'etichetta e non il suo
    # contenuto, mentre i due controlli qui sotto — l'etichetta dev'essere
    # dentro il ramo principale, gli script vengono dal ramo principale — quel
    # contenuto lo leggono davvero. In cambio il ramo principale è stato
    # protetto: non si scrive direttamente, ci si arriva solo con le prove
    # passate. Il conto per cui si è cambiato sta in SECURITY.md.
    environment: rilascio
    # Il permesso di scrittura vive nel job, non nel workflow: così non viene
    # ereditato da eventuali job futuri che non ne hanno bisogno.
    permissions:
      contents: write
    timeout-minutes: 45

    steps:
      # Due prelievi, non uno.
      #
      # Prima ce n'era uno solo, e prendeva **tutto** dall'etichetta: sia l'app
      # da impacchettare sia gli script che la impacchettano. Ma gli script
      # girano con il certificato della fondazione aperto nel portachiavi, e
      # un'etichetta la può creare chiunque abbia accesso in scrittura: bastava
      # un'etichetta con un `build.sh` modificato per farci firmare qualunque
      # cosa. L'unica difesa era l'approvazione a mano, che guarda il nome
      # dell'etichetta e non il suo contenuto.
      #
      # Adesso: **quello che gira** viene dal ramo principale, cioè da codice
      # che è passato da una revisione; **quello che viene impacchettato** viene
      # dall'etichetta.
      - name: Prendo il ramo principale, che è quello di cui mi fido
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          path: fidato

      # Il secondo cancello, e il più importante: un'etichetta che non sta
      # dentro il ramo principale non è mai stata rivista da nessuno. Qui il
      # rilascio si ferma, prima ancora di aprire il portachiavi.
      - name: Controllo che l'etichetta sia dentro il ramo principale
        working-directory: fidato
        env:
          # L'etichetta passa da una variabile d'ambiente, non interpolata
          # nello script: un nome scritto ad arte diventerebbe altrimenti un
          # comando eseguito.
          TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$TAG_INPUT"
          # L'etichetta e il ramo partono con la stessa spinta, e ogni tanto
          # l'etichetta arriva per prima: si riprova, invece di bocciare un
          # rilascio buono per una manciata di secondi.
          for tentativo in 1 2 3; do
            git fetch --force --tags origin main >/dev/null 2>&1 || true
            if git merge-base --is-ancestor "$TAG^{commit}" origin/main 2>/dev/null; then
              echo "L'etichetta $TAG è dentro il ramo principale: si procede."
              exit 0
            fi
            echo "Tentativo $tentativo: $TAG non risulta ancora nel ramo principale, aspetto."
            sleep 20
          done
          echo "::error::L'etichetta $TAG non è contenuta nel ramo principale. Un rilascio si fa solo da codice già rivisto e fuso: crea l'etichetta su un commit di main."
          exit 1

      - name: Prendo il codice dell'etichetta, che è quello da impacchettare
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Il numero di build è il conteggio dei commit: serve la storia intera.
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
          path: sorgente

      # Anche se l'etichetta è dentro il ramo principale, gli script che
      # girano sono quelli del ramo principale **di adesso**: se un problema
      # viene scoperto oggi in `package.sh`, ri-pacchettizzare una versione di
      # sei mesi fa non deve rimetterlo in circolo.
      - name: Gli script che girano vengono dal ramo principale
        run: |
          set -euo pipefail
          rm -rf sorgente/scripts sorgente/build.sh sorgente/test.sh
          cp -R fidato/scripts sorgente/scripts
          cp fidato/build.sh fidato/test.sh sorgente/
          chmod +x sorgente/build.sh sorgente/test.sh sorgente/scripts/*.sh

      - name: Preparo Xcode
        working-directory: sorgente
        run: |
          set -euo pipefail
          # Senza questo il rilascio si ferma con «Manca xcodegen» dopo aver
          # gia' aperto il portachiavi di firma: e' esattamente com'e' fallita
          # la 0.6.0. `build.sh` genera il progetto da project.yml prima di
          # compilare, e senza xcodegen non ha con che cosa farlo.
          brew install xcodegen
          ATTESA="$(cat .xcodegen-version)"
          TROVATA="$(xcodegen --version | sed 's/^Version: //')"
          if [ "$ATTESA" != "$TROVATA" ]; then
            echo "::warning::XcodeGen qui è $TROVATA, il progetto committato è stato generato con $ATTESA."
          fi

      - name: Metto il certificato in un portachiavi usa-e-getta
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12" ]; then
            echo "::error::Manca il segreto MACOS_CERT_P12. Lancia ./scripts/setup-github-secrets.sh"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/firma.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Compilo, firmo, faccio timbrare da Apple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Se un giorno ci sarà una chiave API di App Store Connect, il
          # segreto non passerà più nemmeno dall'ingresso standard: sarà un
          # file, e i file non si leggono con `ps`. Finché i tre segreti non
          # esistono, queste righe sono vuote e `package.sh` prende l'altra
          # strada da solo.
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        working-directory: sorgente
        run: |
          set -euo pipefail
          if [ -n "${NOTARY_KEY_BASE64:-}" ]; then
            CHIAVE="$RUNNER_TEMP/AuthKey.p8"
            umask 077
            echo "$NOTARY_KEY_BASE64" | base64 --decode > "$CHIAVE"
            export NOTARY_KEY="$CHIAVE"
          fi
          ./scripts/package.sh --notarize
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Verifico che si aprirebbe davvero su un Mac qualsiasi
        working-directory: sorgente
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          hdiutil attach -nobrowse -quiet "build/MirrorScopio-$VERSION.dmg"
          spctl -a -vvv -t install "/Volumes/MirrorScopio $VERSION/MirrorScopio.app" 2>&1 | tee /tmp/spctl.txt
          hdiutil detach "/Volumes/MirrorScopio $VERSION" -quiet
          grep -q "source=Notarized Developer ID" /tmp/spctl.txt

      - name: Verifico che l'app dentro lo zip si aggiorni davvero
        working-directory: sorgente
        run: |
          set -euo pipefail
          # Lo zip è il pacchetto che le versioni già installate scaricano da
          # sole. Qui si controlla esattamente quello che controllerà l'app sul
          # Mac di una famiglia: la firma è la nostra, e il timbro di Apple è
          # attaccato addosso — se manca, l'aggiornamento si fermerebbe lì.
          VERSION="$(cat VERSION)"
          PROVA="$(mktemp -d)"
          ditto -x -k "build/MirrorScopio-$VERSION.zip" "$PROVA"
          codesign --verify --strict --deep "$PROVA/MirrorScopio.app"
          codesign --verify -R '=anchor apple generic and certificate leaf[subject.OU] = "93T3LG4NPG" and identifier "org.fightthestroke.mirrorscopio"' "$PROVA/MirrorScopio.app"
          spctl --assess --type execute -vv "$PROVA/MirrorScopio.app" 2>&1 | tee /tmp/spctl-zip.txt
          grep -q "source=Notarized Developer ID" /tmp/spctl-zip.txt
          xcrun stapler validate "$PROVA/MirrorScopio.app"
          rm -rf "$PROVA"

      - name: Allego il pacchetto alla release
        working-directory: sorgente
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          # Il tag passa da una variabile d'ambiente, non interpolato nello
          # script: un tag scritto ad arte diventerebbe altrimenti un comando
          # eseguito con il portachiavi di firma aperto.
          TAG="$TAG_INPUT"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "MirrorScopio $VERSION" --generate-notes
          gh release upload "$TAG" "build/MirrorScopio-$VERSION.dmg" \
            "build/MirrorScopio-$VERSION.zip" --clobber

      - name: Tengo da parte il pacchetto anche qui
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MirrorScopio-dmg
          path: |
            sorgente/build/*.dmg
            sorgente/build/*.zip
          retention-days: 30
