name: Verifica

# A ogni push si controlla che l'app compili ancora **e che le prove passino**.
# Non serve nessun certificato: qui si firma alla buona, tanto il pacchetto vero
# lo fa il workflow di rilascio.
#
# Per settimane questo workflow ha solo compilato: `./test.sh` non veniva
# invocato ne' su push ne' su pull request, e il badge verde nel README voleva
# dire soltanto «compila». Le prove esistevano e passavano, ma passavano sul Mac
# di chi le lanciava a mano — cioe' esattamente la garanzia che una CI serve a
# non dover chiedere a nessuno. Chi apriva una pull request non aveva nessun
# cancello: poteva rompere la scala adattiva o il contrasto dei colori e vedere
# comunque la spunta verde.
# Serve solo leggere il codice: nessun permesso di scrittura.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compila:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: La promessa — niente rete in Sources/
        run: |
          set -euo pipefail
          # AGENTS.md, regola 2: "una URLSession in questo codice è un bug".
          # Finché era solo una frase, bastava una distrazione a tradirla.
          # Adesso è un cancello: se rientra la rete, la build si ferma.
          # Un'eccezione sola, dichiarata: Updates.swift chiede a GitHub qual è
          # l'ultima versione. È una domanda su di noi, non su chi usa l'app.
          # Ovunque altro la rete resta vietata, e questo cancello lo dimostra
          # a ogni push senza che nessuno debba fidarsi della nostra parola.
          # L'elenco copre anche le vie di servizio: scaricare un URL con
          # Data(contentsOf:) o lanciare curl da un Process non passa da
          # URLSession, ma porta i dati fuori esattamente allo stesso modo.
          # Un cancello che dimentica le porte sul retro non e una prova.
          VIETATI='URLSession|URLRequest|NWConnection|CFReadStream|import Network'
          VIETATI="$VIETATI"'|Data\(contentsOf:|String\(contentsOf:|Data\(contentsOfURL'
          VIETATI="$VIETATI"'|Process\(|NSTask|/usr/bin/curl|CFURLCreateData'
          TROVATO="$(grep -rnE "$VIETATI" Sources/ \
            | grep -v '^Sources/Core/Updates.swift:' || true)"
          if [ -n "$TROVATO" ]; then
            echo "$TROVATO"
            echo "::error::I dati del bambino non escono da quel Mac. Qui c'è del codice di rete."
            exit 1
          fi
          echo "Nessuna rete in Sources/ — la promessa regge."

      - name: Compilo
        run: ./build.sh

      - name: Controllo che l'app sia davvero un'app
        run: |
          set -euo pipefail
          test -x build/MirrorScopio.app/Contents/MacOS/MirrorScopio
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" \
            build/MirrorScopio.app/Contents/Info.plist
          codesign --verify --verbose=1 build/MirrorScopio.app

      - name: Controllo che la versione e il changelog siano allineati
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' \
            build/MirrorScopio.app/Contents/Info.plist)"
          if [ "$VERSION" != "$PLIST_VERSION" ]; then
            echo "::error::VERSION dice $VERSION ma l'app dice $PLIST_VERSION"
            exit 1
          fi
          grep -q "## \[$VERSION\]\|## \[Non ancora rilasciato\]" CHANGELOG.md

      # Le prove che si possono fare senza un essere umano davanti: la scala
      # adattiva, il contrasto dei colori in tutti i temi, il confronto fra
      # versioni, e il fatto che nessuna schermata nasconda i propri pulsanti.
      # Restano fuori microfono, punteggio e modello vocale: hanno bisogno di un
      # microfono vero e del modello di sistema, che qui non esistono. Quelle le
      # lancia Roberto con `./test.sh --all`, ed e' scritto qui perche' si sappia
      # che cosa questo cancello non controlla.
      - name: Eseguo le prove
        run: ./test.sh

      # Le prove che aprono l'applicazione vera e la usano senza mouse, leggendo
      # l'albero di accessibilita' — cioe' quello che VoiceOver pronuncia. Girano
      # qui perche' l'accessibilita' controllata a occhio non e' una promessa:
      # per settimane ho scritto che l'app era usabile da tastiera senza che
      # nessuno l'avesse mai attraversata premendo solo Tab.
      - name: Preparo Xcode
        run: brew install xcodegen

      # Finche' «Navigazione da tastiera» e' spenta, Tab salta da un campo di
      # testo all'altro e ignora i pulsanti: le prove si fermerebbero dichiarando
      # che non hanno provato niente. Qui la accendiamo apposta, cosi' il
      # controllo si fa davvero.
      - name: Accendo la navigazione da tastiera
        run: defaults write -g AppleKeyboardUIMode -int 3

      # Nota onesta su quello che questo cancello NON controlla: le due prove sul
      # fuoco della tastiera hanno bisogno del permesso di accessibilita', che su
      # una macchina senza nessuno davanti non si puo' concedere. Li' si fermano
      # dichiarando perche', invece di passare a vuoto. Quelle le lancia Roberto
      # sul suo Mac.
      - name: Eseguo le prove di accessibilita'
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild test -project MirrorScopio.xcodeproj -scheme MirrorScopio \
            -destination 'platform=macOS'
